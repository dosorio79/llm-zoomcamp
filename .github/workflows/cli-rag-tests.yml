name: CLI RAG tests

on:
  push:
    branches:
      - dev
      - master
    paths:
      - "cli_rag/**"
      - ".github/workflows/cli-rag-tests.yml"
  pull_request:
    branches:
      - dev
      - master
    paths:
      - "cli_rag/**"
      - ".github/workflows/cli-rag-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cli_rag

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Compile Python files
        run: uv run python -m compileall -q src tests main.py
