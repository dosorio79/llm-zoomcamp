[project]
name = "cli-rag"
version = "0.1.0"
description = "Terminal RAG app with PostgreSQL BM25, vector, hybrid, and agentic retrieval modes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitsource>=0.0.5",
    "numpy>=2.4.6",
    "onnxruntime>=1.27.0",
    "openai>=2.41.1",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.2.0",
    "rich>=15.0.0",
    "tokenizers>=0.23.1",
    "toyaikit>=0.0.11",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.21.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
